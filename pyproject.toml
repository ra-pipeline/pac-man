[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pac-man"
version = "0.1.0"
description = "Pipeline Orchestration using Parsl for HPC/HTC execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "parsl",
    "pyyaml",
]

[project.scripts]
pac-man = "pac_man.cli:main"
pacman = "pac_man.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
