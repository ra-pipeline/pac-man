[workspace]
name = "pac-man"
version = "0.1.0"
description = "Pipeline Orchestration Package using Parsl"
authors = ["Rui Xue <rx.astro@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation.env]
# Suppress noisy Python 3.12 escape sequence/literal warnings from CASA packages
PYTHONWARNINGS = "ignore::SyntaxWarning"
# Allow casaplotms legacy pb2 descriptors to run under protobuf >= 4 (required by streamlit)
PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION = "python"

[dependencies]
python = "3.12.*"
numpy = "<2.4"
parsl = "*"
sqlalchemy = "*"
flask-sqlalchemy = "*"
flask = "*"
pandas = "*"
plotly = "*"
networkx = "*"
pytest = "*"
ipython = "*"
conda-ecosystem-user-package-isolation = "*"
pip = ">=23.0"
openmpi-mpicxx = ">=5.0"
mpi4py = ">=3.1.5"
certifi = "*"
poppler = "*"
imagemagick = "*"
pydot = "*"
graphviz = "*"
pyvirtualdisplay = "*"
streamlit = "*"
cachetools = ">=6.2,<7"

[pypi-dependencies]
grpcio = ">=1.62"
six = ">=1.17"
casampi = { version = ">=0.5.5", index = "https://casa-pip.nrao.edu/repository/pypi-group/simple" }
casaplotms = { version = ">=2.5.3", index = "https://casa-pip.nrao.edu/repository/pypi-group/simple" }
casaplotserver = { version = ">=1.8.2", index = "https://casa-pip.nrao.edu/repository/pypi-group/simple" }
casashell = { version = "==6.7.4.*", index = "https://casa-pip.nrao.edu/repository/pypi-group/simple" }
casatools = { version = "==6.7.4.*", index = "https://casa-pip.nrao.edu/repository/pypi-group/simple" }
casatasks = { version = "==6.7.4.*", index = "https://casa-pip.nrao.edu/repository/pypi-group/simple" }
pipeline = { git = "https://open-bitbucket.nrao.edu/scm/pipe/pipeline.git", branch = "PIPE-3269-add-parsl-adaptation-layer-in-pipeline" }
pac-man = { path = ".", editable = true }


[tasks]
test = "PYTHONPATH=.:src:tests pytest tests/"
visualize = "parsl-visualize"
dashboard = "streamlit run scripts/dashboard.py --server.headless true --server.fileWatcherType none"

